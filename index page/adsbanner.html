<!-- ADS BANNER SECTION start -->
<style>
    /* Ads Banner Container */
    .ads-banner-container {
        scroll-snap-type: x mandatory;
        overflow-x: auto;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        -ms-overflow-style: none;
    }

    .ads-banner-container::-webkit-scrollbar {
        display: none;
    }

    /* Ads Banner Slide */
    .ads-banner-slide {
        scroll-snap-align: start;
        flex: 0 0 100%;
        min-width: 100%;
        background: transparent;
    }

    .ads-banner-slide img {
        width: 100%;
        height: 140px;
        object-fit: cover;
        display: block;
        border-radius: 0.75rem;
        border: 2px solid #14281D;
    }

    /* Sponsored Label */
    .ads-sponsored-label {
        position: absolute;
        top: -0.25rem;
        right: 1rem;
        background-color: #14281D;
        color: #FFFCDC;
        font-size: 0.75rem;
        padding: 0.125rem 0.5rem;
        border-radius: 0.375rem;
        z-index: 5;
    }
</style>

<!-- ADS BANNER SECTION -->
<section class="px-4 pt-3 pb-1">
    <div class="relative">
        <!-- Ads Banner Carousel -->
        <div id="adsBanner" class="ads-banner-container flex gap-0 overflow-x-auto rounded-xl">
            <div class="ads-banner-slide shrink-0 w-full snap-start">
                <img src="images/adslide1.png" alt="বিজ্ঞাপন ১"
                    class="w-full h-36 object-cover rounded-xl border-2 border-[#14281D]">
            </div>
            <div class="ads-banner-slide shrink-0 w-full snap-start">
                <img src="images/adslide2.png" alt="বিজ্ঞাপন ২"
                    class="w-full h-36 object-cover rounded-xl border-2 border-[#14281D]">
            </div>
            <div class="ads-banner-slide shrink-0 w-full snap-start">
                <img src="images/adslide3.png" alt="বিজ্ঞাপন ৩"
                    class="w-full h-36 object-cover rounded-xl border-2 border-[#14281D]">
            </div>
            <div class="ads-banner-slide shrink-0 w-full snap-start">
                <img src="images/adslide4.png" alt="বিজ্ঞাপন ৪"
                    class="w-full h-36 object-cover rounded-xl border-2 border-[#14281D]">
            </div>
        </div>

        <!-- Sponsored Label -->
        <div class="ads-sponsored-label">বিজ্ঞাপন</div>
    </div>
</section>

<!-- ADS BANNER JAVASCRIPT -->
<script>
    (function () {
        // Ads banner auto-scroll
        const adsBanner = document.getElementById('adsBanner');
        if (adsBanner) {
            let adsIdx = 0;
            const adsSlides = document.querySelectorAll('.ads-banner-slide');
            let adsInterval;

            // Start auto scroll
            function startAdsAutoScroll() {
                adsInterval = setInterval(() => {
                    adsIdx = (adsIdx + 1) % adsSlides.length;
                    const slideWidth = adsBanner.clientWidth;
                    adsBanner.scrollTo({
                        left: adsIdx * slideWidth,
                        behavior: 'smooth'
                    });
                }, 4000);
            }

            // Start auto scroll
            startAdsAutoScroll();

            // Pause on hover
            adsBanner.addEventListener('mouseenter', () => {
                clearInterval(adsInterval);
            });

            // Resume on mouse leave
            adsBanner.addEventListener('mouseleave', () => {
                startAdsAutoScroll();
            });

            // Handle window resize
            window.addEventListener('resize', () => {
                // Maintain scroll position after resize
                const slideWidth = adsBanner.clientWidth;
                adsBanner.scrollLeft = adsIdx * slideWidth;
            });
        }
    })();
</script>
<!-- ads banner section end -->
